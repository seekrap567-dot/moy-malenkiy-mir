<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5dce6">
<meta name="description" content="Личный дневник и планер в стиле скрапбукинга">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Мой маленький мир</title>
<style>
:root{--bg:#fff6f8;--paper:#fffdfb;--ink:#5b4050;--muted:#997f8d;--pink:#f4c9d9;--deep:#bd7795;--lav:#e9ddf5;--sage:#dce9dc;--yellow:#fff0bd;--line:#f0dbe4;--shadow:0 7px 22px #a96c8517}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background-image:radial-gradient(#f0cada 1px,transparent 1px);background-size:18px 18px}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:14px 13px 94px}
header{padding:16px 14px 13px;border:2px dashed #e7bdcd;border-radius:22px;background:var(--paper);box-shadow:var(--shadow);position:relative}
header:after{content:"✿";position:absolute;right:18px;top:12px;color:#d99bb5;font-size:27px}
.eyebrow{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}.brand{font-family:Georgia,serif;font-size:29px;margin:3px 38px 4px 0}.subtitle{font-size:13px;color:var(--muted)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}
.datepill,.sticker{background:var(--yellow);border-radius:999px;padding:7px 11px;font-size:12px;display:inline-block;transform:rotate(-1deg)}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
nav{display:flex;gap:7px;overflow:auto;padding:4px 0 11px;scrollbar-width:none}nav button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 12px;font-size:13px}nav button.active{background:var(--deep);color:white;border-color:var(--deep)}
h2{font-family:Georgia,serif;font-size:23px;margin:8px 0 4px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow);position:relative;overflow:hidden}.paper.tilt1{transform:rotate(-.5deg)}.paper.tilt2{transform:rotate(.5deg)}.paper:before{content:"";position:absolute;top:0;left:15px;right:15px;border-top:3px dotted #edc6d5}
.bigemoji{font-size:26px}.stat{font-size:23px;font-family:Georgia,serif;margin-top:5px}.btn{border:0;border-radius:12px;background:var(--deep);color:white;padding:10px 13px;font-weight:600}.btn.secondary{background:#f7e4ec;color:#744b60}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.small{padding:7px 10px;font-size:12px}.full{width:100%}
.field{display:block;margin:10px 0}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:white;outline-color:var(--deep)}textarea{min-height:105px;resize:vertical}
.item{padding:11px 0;border-bottom:1px dashed var(--line);display:flex;gap:9px;align-items:flex-start}.item:last-child{border-bottom:0}.itemmain{flex:1;min-width:0}.itemtitle{font-weight:650;overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.check{width:20px;height:20px;accent-color:var(--deep);flex-shrink:0;margin-top:2px}
.bookgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}.book{height:66px;border:0;border-radius:5px 9px 9px 5px;color:#fff;font-size:11px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);box-shadow:inset -4px 0 #00000014,0 2px 3px #00000012;padding:5px 2px;overflow:hidden}.book.filled{outline:2px solid #fff;outline-offset:-4px}.filmgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.film{border:3px dashed #d7a6b9;background:#fff;padding:9px;border-radius:12px}.poster{height:105px;border-radius:8px;background:linear-gradient(135deg,#f8d7e4,#e8dcf4);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.stars{color:#d89b33;letter-spacing:2px}
.empty{padding:20px 10px;text-align:center;color:var(--muted);font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#fff9fbef;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.bottominner{max-width:760px;width:100%;display:flex;justify-content:space-around;gap:4px}.bottom button{border:0;background:transparent;font-size:11px;color:var(--muted);padding:5px}.bottom button span{display:block;font-size:20px;margin-bottom:2px}.bottom button.active{color:var(--deep);font-weight:700}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}.notice{background:#fff0bd;border-radius:13px;padding:10px;font-size:12px;margin:12px 0}.palette{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:32px;height:32px;border:2px solid white;box-shadow:0 0 0 1px #d9c3ce;border-radius:50%}
.monthhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:38px;text-align:center;padding:7px 1px;border-radius:9px;background:#fff;font-size:12px}.cal .weekday{background:transparent;color:var(--muted);min-height:20px}.cal .today{background:var(--deep);color:#fff}.cal .has{box-shadow:inset 0 -3px #edbfd1}
.hidden{display:none!important}
@media(min-width:600px){.bookgrid{grid-template-columns:repeat(10,minmax(0,1fr))}.book{height:78px}.filmgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="eyebrow">твой уютный уголок · личный планер</div>
<div class="brand">Мой маленький мир ✿</div>
<div class="subtitle">маленькие шаги тоже ведут к мечтам</div>
<div class="toprow"><span class="datepill" id="todayLabel"></span><span class="sticker">сделано с любовью ♡</span></div>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<div class="notice">🧷 Это ранняя версия: данные хранятся на этом устройстве. Экспортируй резервную копию в разделе «Ещё», чтобы не потерять записи.</div>
</div>
<div class="bottom"><div class="bottominner" id="bottomNav"></div></div>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const initial={tasks:[],diary:[],books:Array.from({length:70},(_,i)=>({slot:i+1,title:'',author:'',status:'Хочу прочитать',rating:0,note:''})),films:[],habits:[],trackers:[],entries:[],events:[],notes:[],settings:{theme:'pink'},favoriteQuotes:[]};
let data;try{data={...initial,...JSON.parse(localStorage.getItem('mmm-data')||'{}')}}catch(e){data=structuredClone(initial)}
if(!Array.isArray(data.books)||data.books.length!==70)data.books=initial.books;
let page='home', calDate=new Date(), editId=null;
const quotes=[
{q:'Мне не нужно быть идеальной, чтобы быть замечательной.',by:'Аффирмация для себя',cat:'любовь к себе'},
{q:'Даже маленький шаг — это уже движение вперёд.',by:'Напоминание дня',cat:'мотивация'},
{q:'Я имею право отдыхать и восстанавливать силы.',by:'Аффирмация для себя',cat:'спокойствие'},
{q:'Мой темп — это мой темп. Я не обязана сравнивать себя с другими.',by:'Напоминание дня',cat:'уверенность'},
{q:'Мне можно начинать заново столько раз, сколько нужно.',by:'Аффирмация для себя',cat:'новое начало'},
{q:'Мои мечты заслуживают места в моей жизни.',by:'Напоминание дня',cat:'мечты'},
{q:'Я учусь, пробую и постепенно становлюсь увереннее.',by:'Аффирмация для себя',cat:'учёба'},
{q:'Сегодня не обязательно сделать всё. Достаточно сделать то, что мне по силам.',by:'Напоминание дня',cat:'без давления'},
{q:'Я могу гордиться собой даже за незаметные другим усилия.',by:'Аффирмация для себя',cat:'маленькие победы'},
{q:'Моя ценность не зависит от количества выполненных дел.',by:'Напоминание дня',cat:'любовь к себе'},
{q:'Я заслуживаю доброты — в том числе от самой себя.',by:'Аффирмация для себя',cat:'забота'},
{q:'Впереди ещё много хороших историй, и я могу написать свою.',by:'Напоминание дня',cat:'мечты'},
{q:'Я могу попросить о помощи, когда она мне нужна.',by:'Аффирмация для себя',cat:'поддержка'},
{q:'Не каждый день должен быть продуктивным, чтобы быть важным.',by:'Напоминание дня',cat:'спокойствие'},
{q:'Я разрешаю себе быть собой — настоящей, живой и разной.',by:'Аффирмация для себя',cat:'уверенность'}
];
let quoteIndex=Math.floor(Math.random()*quotes.length);

const themes={pink:['#fff6f8','#fffdfb','#5b4050','#f4c9d9','#bd7795'],lavender:['#f8f4ff','#fffdfd','#514565','#e4dafa','#987ab9'],sage:['#f4faf4','#fffefa','#425647','#dce9dc','#729a7b'],peach:['#fff6f0','#fffdf9','#65483e','#f8d8c8','#c78169']};
function save(){localStorage.setItem('mmm-data',JSON.stringify(data))}
function applyTheme(){let t=themes[data.settings.theme]||themes.pink;['--bg','--paper','--ink','--pink','--deep'].forEach((k,i)=>document.documentElement.style.setProperty(k,t[i]));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const navItems=[['home','🏡','Домой'],['planner','🗓️','Планер'],['diary','📔','Дневник'],['books','📚','Книги'],['films','🎬','Кино'],['trackers','🌱','Трекеры'],['notes','✂️','Заметки'],['more','🧺','Ещё']];
function nav(){ $('#nav').innerHTML=navItems.map(([id,e,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${e} ${t}</button>`).join('');$('#bottomNav').innerHTML=navItems.slice(0,5).map(([id,e,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${e}</span>${t}</button>`).join('')}
function go(p){page=p;editId=null;render()}
function title(t,sub=''){return `<div class="sectionhead"><div><h2>${t}</h2>${sub?`<div class="muted">${sub}</div>`:''}</div></div>`}
function card(content,cls=''){return `<section class="paper ${cls}">${content}</section>`}
function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function field(label,name,value='',type='text',placeholder=''){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`}
function area(label,name,value='',placeholder=''){return `<label class="field"><span>${label}</span><textarea name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></label>`}
function home(){let open=data.tasks.filter(x=>!x.done).length,q=quotes[quoteIndex],fav=(data.favoriteQuotes||[]).includes(q.q);return title('Привет, мечтательница ✿','Добро пожаловать в твою бумажную вселенную')+card(`<div class="row" style="justify-content:space-between"><span class="sticker">💌 послание для тебя</span><button class="btn small ghost" onclick="nextQuote()" aria-label="Другая цитата">🔄 Ещё</button></div><div style="font-family:Georgia,serif;font-size:20px;line-height:1.45;margin:14px 0 8px">“${esc(q.q)}”</div><div class="muted">${esc(q.by)} · ${esc(q.cat)}</div><div class="actions"><button class="btn secondary small" onclick="toggleFavoriteQuote()">${fav?'💗 В избранном':'♡ Сохранить фразу'}</button><button class="btn ghost small" onclick="showFavorites()">⭐ Мои фразы (${(data.favoriteQuotes||[]).length})</button></div>`, 'tilt1')+`<div class="grid">${card(`<div class="bigemoji">📝</div><div class="muted">дел на сегодня</div><div class="stat">${open}</div><button class="btn secondary small" onclick="go('planner')">Открыть планер</button>`,'tilt1')}${card(`<div class="bigemoji">📚</div><div class="muted">прочитано книг</div><div class="stat">${data.books.filter(b=>b.status==='Прочитана').length}/70</div><button class="btn secondary small" onclick="go('books')">Моя полка</button>`,'tilt2')}${card(`<div class="bigemoji">💌</div><div class="muted">записей в дневнике</div><div class="stat">${data.diary.length}</div><button class="btn secondary small" onclick="go('diary')">Записать день</button>`,'tilt2')}${card(`<div class="bigemoji">🌱</div><div class="muted">моих трекеров</div><div class="stat">${data.trackers.length}</div><button class="btn secondary small" onclick="go('trackers')">Мои привычки</button>`,'tilt1')}</div><div class="sectionhead"><h3>✂️ Быстрые заметки</h3>${btn('+ Заметка',"go('notes')",'small secondary')}</div>${card(`<div class="muted">Идея дня: запиши одну маленькую вещь, которую хочется сделать для себя.</div><div class="actions">${btn('＋ Добавить задачу',"go('planner')",'small')}${btn('＋ Запись в дневник',"go('diary')",'small secondary')}${btn('＋ Свой трекер',"go('trackers')",'small secondary')}</div>`)} `}
function planner(){let tasks=data.tasks.filter(x=>x.date===today());let other=data.tasks.filter(x=>x.date!==today());return title('Мой планер 🗓️','Планы, встречи и маленькие победы')+card(`<form onsubmit="addTask(event)"><h3>＋ Новая задача</h3>${field('Что нужно сделать?','text','','text','Например, повторить английский') }<div class="row"><label class="field grow"><span>Дата</span><input name="date" type="date" value="${today()}"></label><label class="field grow"><span>Время (необязательно)</span><input name="time" type="time"></label></div><div class="row"><label class="field grow"><span>Приоритет</span><select name="priority"><option>Обычный</option><option>Важный</option><option>Срочный</option></select></label><label class="field grow"><span>Раздел</span><select name="category"><option>Личное</option><option>Учёба</option><option>Дом</option><option>Здоровье и уход</option><option>Другое</option></select></label></div><button class="btn full">Добавить в планер ♡</button></form>`)+`<div class="sectionhead"><h3>На сегодня · ${fmt(today())}</h3></div>`+card(taskList(tasks))+title('Календарь месяца','Нажми на день, чтобы посмотреть задачи')+card(calendar())+title('Другие задачи')+card(taskList(other))}
function taskList(arr){if(!arr.length)return `<div class="empty">Пока пусто — можно выдохнуть ☁️</div>`;return arr.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(t=>`<div class="item"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="itemmain"><div class="itemtitle" style="${t.done?'text-decoration:line-through;opacity:.55':''}">${esc(t.text)}</div><div class="muted">${fmt(t.date)} ${t.time||''} · ${esc(t.category)} · ${esc(t.priority)}</div><div class="actions">${btn('Изменить',"editTask('"+t.id+"')",'small secondary')}${btn('Удалить',"del('tasks','"+t.id+"')",'small ghost')}</div></div></div>`).join('')}
function calendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),offset=(first.getDay()+6)%7;let cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<offset;i++)cells+='<div style="background:transparent"></div>';for(let d=1;d<=last.getDate();d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=data.tasks.some(t=>t.date===ds)||data.events.some(t=>t.date===ds);cells+=`<div class="${ds===today()?'today ':''}${has?'has':''}" onclick="pickDate('${ds}')">${d}</div>`}return `<div class="monthhead">${btn('‹',"shiftMonth(-1)",'small secondary')}<strong>${new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong>${btn('›',"shiftMonth(1)",'small secondary')}</div><div class="cal">${cells}</div><p class="muted">Отмеченные точки — дни с задачами или событиями.</p>`}
function diary(){return title('Страницы моего дневника 📔','Можно писать как угодно — это твоё место')+card(`<form onsubmit="addDiary(event)"><h3>✎ Новая страница</h3>${field('Дата','date',today(),'date')}${field('Заголовок','title','','text','Сегодняшняя история…')}${area('Мои мысли','body','','Что хочется сохранить в памяти?') }<label class="field"><span>Настроение</span><select name="mood"><option>🌷 Спокойное</option><option>😊 Радостное</option><option>🌧️ Грустное</option><option>⚡ Энергичное</option><option>🌙 Уставшее</option><option>💭 Смешанные чувства</option></select></label><button class="btn full">Сохранить страницу ♡</button></form>`)+`<div class="sectionhead"><h3>Мои страницы</h3></div>`+card(data.diary.length?data.diary.slice().reverse().map(d=>`<div class="item"><div class="itemmain"><div class="muted">${fmt(d.date)} · ${esc(d.mood)}</div><div class="itemtitle">${esc(d.title||'Без заголовка')}</div><p>${esc(d.body).replace(/\n/g,'<br>')}</p><div class="actions">${btn('Удалить',"del('diary','"+d.id+"')",'small ghost')}</div></div></div>`).join(''):`<div class="empty">Здесь будут жить твои истории 💌</div>`)}
function books(){let colors=['#bd829c','#9e8ab7','#d5a35c','#7fa39b','#cc8b80','#778eb2','#aa9b6e'];return title('Моя книжная полка 📚','70 маленьких мест для больших историй')+card(`<div class="row"><span class="sticker">Прочитано ${data.books.filter(b=>b.status==='Прочитана').length} из 70</span><span class="muted">${data.books.filter(b=>b.title).length} заполнено</span></div><div class="bookgrid">${data.books.map((b,i)=>`<button class="book ${b.title?'filled':''}" style="background:${colors[i%colors.length]};${!b.title?'opacity:.68':''}" onclick="editBook(${i})" title="${esc(b.title||'Книга '+(i+1))}">${b.title?esc(b.title).slice(0,19):i+1}</button>`).join('')}</div><p class="muted">Нажми на корешок книги, чтобы добавить название и автора.</p>`)+ (editId!==null?bookForm(data.books[editId]):'')+title('Список книг','Все твои книжные истории')+card(data.books.filter(b=>b.title).length?data.books.filter(b=>b.title).map(b=>`<div class="item"><div class="itemmain"><div class="itemtitle">${esc(b.title)}</div><div class="muted">${esc(b.author||'Автор не указан')} · ${esc(b.status)} · <span class="stars">${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</span></div></div><button class="btn small secondary" onclick="editBook(${b.slot-1})">Изменить</button></div>`).join(''):`<div class="empty">Полка ждёт свои первые истории 🌷</div>`)}
function bookForm(b){return card(`<form onsubmit="saveBook(event,${b.slot-1})"><h3>📖 Книга №${b.slot}</h3>${field('Название','title',b.title,'text','Название книги')}${field('Автор','author',b.author,'text','Имя автора')}<label class="field"><span>Статус</span><select name="status">${['Хочу прочитать','Читаю','Прочитана','Бросила'].map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field"><span>Оценка</span><select name="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${b.rating===n?'selected':''}>${n?n+' ★':'Без оценки'}</option>`).join('')}</select></label>${area('Заметки','note',b.note,'Цитаты, мысли, впечатления…')}<div class="row">${btn('Сохранить',"",'') }<button class="btn secondary" type="button" onclick="editId=null;render()">Закрыть</button></div></form>`)}
function films(){return title('Кино и сериалы 🎬','Моя личная киноплёнка')+card(`<form onsubmit="addFilm(event)"><h3>＋ Добавить просмотр</h3>${field('Название','title','','text','Фильм или сериал')}${field('Постер (необязательно)','poster','','url','Ссылка на изображение') }<div class="row"><label class="field grow"><span>Дата просмотра</span><input name="date" type="date" value="${today()}"></label><label class="field grow"><span>Оценка</span><select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)}</option>`).join('')}</select></label></div><label class="field"><span>Тип</span><select name="kind"><option>Фильм</option><option>Сериал</option><option>Мультфильм</option><option>Аниме</option></select></label>${area('Впечатления','note','','Что понравилось?') }<button class="btn full">Добавить в киноплёнку ✨</button></form>`)+title('Моя коллекция')+(data.films.length?`<div class="filmgrid">${data.films.slice().reverse().map(f=>`<article class="film"><div class="poster">${f.poster?`<img src="${esc(f.poster)}" alt="Постер" onerror="this.remove()">`:'🎞️'}</div><h3 style="margin-top:8px">${esc(f.title)}</h3><div class="muted">${esc(f.kind)} · ${fmt(f.date)}</div><div class="stars">${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</div>${f.note?`<p class="muted">${esc(f.note)}</p>`:''}<button class="btn small ghost" onclick="del('films','${f.id}')">Удалить</button></article>`).join('')}</div>`:card('<div class="empty">Добавь первый фильм — и плёнка оживёт 🍿</div>'))}
function trackers(){return title('Мои трекеры 🌱','Отмечай маленькие шаги или создай свой')+card(`<form onsubmit="addTracker(event)"><h3>＋ Создать трекер</h3>${field('Название','name','','text','Например, рисование') }<label class="field"><span>Значок</span><select name="emoji">${['🌱','💧','📚','🧴','🌙','💗','🏃','💰','🎨','🧘','📝','✨','🍵','🎧'].map(e=>`<option>${e}</option>`).join('')}</select></label><label class="field"><span>Тип</span><select name="kind"><option>Ежедневная отметка</option><option>Число или количество</option><option>Текстовая заметка</option></select></label><button class="btn full">Создать мой трекер</button></form>`)+ (data.trackers.length?data.trackers.map(t=>card(`<div class="row"><div class="bigemoji">${esc(t.emoji)}</div><div class="grow"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.kind)}</div></div>${btn('Удалить',"del('trackers','"+t.id+"')",'small ghost')}</div>${t.kind==='Ежедневная отметка'?`<label class="row" style="margin-top:10px"><input class="check" type="checkbox" ${t.logs?.[today()]?'checked':''} onchange="toggleTracker('${t.id}',this.checked)"><span>Отметить за сегодня</span></label>`:t.kind==='Число или количество'?`<form onsubmit="logTracker(event,'${t.id}')"><div class="row"><input name="value" type="number" step="any" placeholder="Сколько?" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"><button class="btn small">Сохранить</button></div></form><div class="muted">Сегодня: ${esc(t.logs?.[today()]??'—')}</div>`:`<form onsubmit="logTracker(event,'${t.id}')"><textarea name="value" placeholder="Запись за сегодня">${esc(t.logs?.[today()]||'')}</textarea><button class="btn small">Сохранить</button></form>`}`, 'tilt1')).join(''):`<div class="empty">Создай первый трекер под себя ✨</div>`)}
function notes(){return title('Заметки и вырезки ✂️','Идеи, списки желаний, мысли и фотографии')+card(`<form onsubmit="addNote(event)"><h3>＋ Новая заметка</h3>${field('Заголовок','title','','text','Идея, вишлист, рецепт…')}${area('Текст','body','','Запиши всё, что не хочется забыть')}${field('Ссылка на картинку (необязательно)','image','','url','https://…')}<button class="btn full">Приклеить на страницу</button></form>`)+ (data.notes.length?data.notes.slice().reverse().map(n=>card(`${n.image?`<img src="${esc(n.image)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px">`:''}<span class="sticker">✂️ заметка</span><h3 style="margin-top:10px">${esc(n.title)}</h3><p>${esc(n.body).replace(/\n/g,'<br>')}</p><div class="actions">${btn('Удалить',"del('notes','"+n.id+"')",'small ghost')}</div>`,'tilt1')).join(''):`<div class="empty">Здесь будет твоя коллекция идей 🌼</div>`)}
function more(){return title('Настройки и забота о данных 🧺','Настрой пространство под себя')+card(`<h3>🎨 Цветовая палитра</h3><p class="muted">Выбери фон и настроение страниц.</p><div class="palette">${Object.entries({pink:'#f4c9d9',lavender:'#e4dafa',sage:'#dce9dc',peach:'#f8d8c8'}).map(([k,c])=>`<button class="swatch" style="background:${c}" aria-label="${k}" onclick="setTheme('${k}')"></button>`).join('')}</div><p class="muted">Изменения применяются сразу.</p>`)+card(`<h3>💾 Резервная копия</h3><p class="muted">Сохрани файл с данными, чтобы при необходимости восстановить записи.</p><div class="actions">${btn('Экспортировать данные',"exportData()") }<label class="btn secondary" style="display:inline-block">Импортировать<input type="file" accept="application/json" hidden onchange="importData(event)"></label></div><p class="muted">Храни файл в надёжном месте. Не делись им, если в нём личные записи.</p>`)+card(`<h3>🧷 Установка</h3><p class="muted">После публикации по HTTPS открой сайт в Chrome → меню ⋮ → «Установить приложение» или «Добавить на главный экран».</p><p class="muted">Офлайн-режим заработает после первого открытия сайта, если сервис-воркер успешно зарегистрировался.</p>`)+card(`<h3>🗑️ Очистить все данные</h3><p class="muted">Это удалит все дневники, задачи, книги, фильмы и трекеры с этого браузера.</p>${btn('Удалить все данные',"clearAll()",'secondary')}`)}
function nextQuote(){let old=quoteIndex;if(quotes.length>1)while(quoteIndex===old)quoteIndex=Math.floor(Math.random()*quotes.length);render()}
function toggleFavoriteQuote(){data.favoriteQuotes=data.favoriteQuotes||[];let q=quotes[quoteIndex].q;if(data.favoriteQuotes.includes(q))data.favoriteQuotes=data.favoriteQuotes.filter(x=>x!==q);else data.favoriteQuotes.unshift(q);save();render()}
function showFavorites(){let fav=data.favoriteQuotes||[];alert(fav.length?'Твои любимые фразы 💗\n\n'+fav.map((q,i)=>(i+1)+'. '+q).join('\n\n'):'Пока нет сохранённых фраз. Нажми «Сохранить фразу» на главном экране 💌')}
function render(){nav();applyTheme();$('#todayLabel').textContent=fmt(today());let html={home,planner,diary,books,films,trackers,notes,more}[page]();$('#view').innerHTML=html; if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function addTask(e){e.preventDefault();let f=new FormData(e.target);data.tasks.push({id:uid(),text:f.get('text').trim(),date:f.get('date')||today(),time:f.get('time'),priority:f.get('priority'),category:f.get('category'),done:false});save();render()}
function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function del(key,id){if(!confirm('Удалить эту запись?'))return;data[key]=data[key].filter(x=>x.id!==id);save();render()}
function addDiary(e){e.preventDefault();let f=new FormData(e.target);data.diary.push({id:uid(),date:f.get('date')||today(),title:f.get('title').trim(),body:f.get('body').trim(),mood:f.get('mood')});save();render()}
function editBook(i){editId=i;render()}
function saveBook(e,i){e.preventDefault();let f=new FormData(e.target);data.books[i]={...data.books[i],title:f.get('title').trim(),author:f.get('author').trim(),status:f.get('status'),rating:Number(f.get('rating')),note:f.get('note').trim()};editId=null;save();render()}
function addFilm(e){e.preventDefault();let f=new FormData(e.target);data.films.push({id:uid(),title:f.get('title').trim(),poster:f.get('poster').trim(),date:f.get('date')||today(),rating:Number(f.get('rating')),kind:f.get('kind'),note:f.get('note').trim()});save();render()}
function addTracker(e){e.preventDefault();let f=new FormData(e.target);data.trackers.push({id:uid(),name:f.get('name').trim(),emoji:f.get('emoji'),kind:f.get('kind'),logs:{}});save();render()}
function toggleTracker(id,val){let t=data.trackers.find(x=>x.id===id);if(t){t.logs=t.logs||{};if(val)t.logs[today()]=true;else delete t.logs[today()]}save();render()}
function logTracker(e,id){e.preventDefault();let f=new FormData(e.target),t=data.trackers.find(x=>x.id===id);if(t){t.logs=t.logs||{};t.logs[today()]=f.get('value')}save();render()}
function addNote(e){e.preventDefault();let f=new FormData(e.target);data.notes.push({id:uid(),title:f.get('title').trim(),body:f.get('body').trim(),image:f.get('image').trim()});save();render()}
function setTheme(k){data.settings.theme=k;save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moy-malenkiy-mir-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.tasks||!d.books||!d.settings)throw 0;if(confirm('Заменить текущие данные данными из резервной копии?')){data=d;save();render()}}catch(err){alert('Не удалось прочитать этот файл резервной копии.')}};r.readAsText(file)}
function clearAll(){if(confirm('Точно удалить ВСЕ данные? Это нельзя отменить. Сначала сделай резервную копию.')){localStorage.removeItem('mmm-data');data=structuredClone(initial);save();render()}}
function shiftMonth(n){calDate.setMonth(calDate.getMonth()+n);render()}
function pickDate(ds){let found=data.tasks.filter(t=>t.date===ds);alert(fmt(ds)+'\\n'+(found.length?found.map(t=>(t.done?'✓ ':'• ')+t.text+(t.time?' '+t.time:'')).join('\\n'):'Пока нет задач на этот день. Добавить задачу можно в разделе «Планер».'))}
function editTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;let text=prompt('Название задачи',t.text);if(text===null)return;let date=prompt('Дата в формате ГГГГ-ММ-ДД',t.date);if(date===null)return;t.text=text.trim()||t.text;t.date=/^\\d{4}-\\d{2}-\\d{2}$/.test(date)?date:t.date;save();render()}
render();
</script>
</body>
</html>
